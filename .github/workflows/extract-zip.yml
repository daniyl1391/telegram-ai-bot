name: Update Project From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Remove old project files
        run: |
          rm -rf bot
          rm -rf tests
          rm -rf vps-bot
          rm -rf extracted
          rm -f main.py
          rm -f Dockerfile
          rm -f README.md
          rm -f requirements.txt
          rm -f railway.toml
          rm -f tests.py

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o telegram_ai_bot_complete.zip -d extracted

      - name: Find project folder
        run: |
          echo "Finding files..."
          find extracted -maxdepth 3 -type f | head -50

      - name: Move project to root
        run: |
          PROJECT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -1)

          echo "Project folder:"
          echo $PROJECT

          cp -r "$PROJECT"/* .
          cp -r "$PROJECT"/.[!.]* . 2>/dev/null || true

      - name: Show final structure
        run: |
          echo "Final files:"
          ls -la
          echo ""
          echo "Folders:"
          find . -maxdepth 2 -type d

      - name: Commit and Force Push
        run: |
          git add .

          git commit -m "Update project from ZIP automatically" || echo "No changes"

          git pull origin main --rebase || true

          git push origin main --force
