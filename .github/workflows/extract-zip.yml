name: Extract VIP ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git Config
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Extract ZIP
        run: |
          mkdir temp
          unzip -o vip.zip -d temp

          echo "ZIP CONTENT:"
          find temp -maxdepth 3 -type f


      - name: Find Project
        run: |
          MAIN=$(find temp -name "main.py" | head -1)

          if [ -z "$MAIN" ]; then
            echo "main.py not found"
            exit 1
          fi

          DIR=$(dirname "$MAIN")

          echo "DIR=$DIR" >> $GITHUB_ENV


      - name: Copy Project
        run: |
          cp -r "$DIR"/* .
          cp -r "$DIR"/.[!.]* . 2>/dev/null || true


      - name: Remove Temp
        run: |
          rm -rf temp


      - name: Check
        run: |
          ls -la
          find . -maxdepth 2 -type f


      - name: Commit
        run: |
          git add .
          git commit -m "Extract VIP project" || true
          git push origin main --force
