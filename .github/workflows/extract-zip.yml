name: Clean Repository Except ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git Config
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Delete Everything Except ZIP
        run: |
          find . -mindepth 1 \
          ! -path "./.git" \
          ! -path "./.git/*" \
          ! -name "telegram_ai_bot_fixed (1).zip" \
          -exec rm -rf {} +

          echo "Done"
          ls -la

      - name: Commit Delete
        run: |
          git add -A
          git commit -m "Delete all files except ZIP" || true
          git push origin main --force
