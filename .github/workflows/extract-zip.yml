name: Clean And Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git Config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Clean Old Project (Keep ZIP)
        run: |
          echo "Removing old project files..."

          rm -rf bot
          rm -rf admin
          rm -rf handlers
          rm -rf services
          rm -rf extracted
          rm -rf tests
          rm -rf tests_stubs

          rm -f main.py
          rm -f Dockerfile
          rm -f railway.toml
          rm -f Procfile
          rm -f README.md
          rm -f requirements.txt
          rm -f .env.example
          rm -f .dockerignore
          rm -f tests.py

          echo "Old project removed"

      - name: Install unzip
        run: |
          sudo apt update
          sudo apt install -y unzip

      - name: Extract ZIP
        run: |
          mkdir extracted

          unzip -o "telegram_ai_bot_fixed (1).zip" -d extracted

          echo "ZIP extracted"

      - name: Detect Project Folder
        run: |
          echo "Searching project..."

          PROJECT=$(find extracted -name "main.py" -exec dirname {} \; | head -1)

          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

          echo "Found:"
          echo $PROJECT

      - name: Copy Correct Project
        run: |
          echo "Copying project..."

          cp -r "$PROJECT"/* .
          cp -r "$PROJECT"/.[!.]* . 2>/dev/null || true

      - name: Verify Structure
        run: |
          echo "FINAL STRUCTURE"

          ls -la

          echo "---"

          find bot -maxdepth 2 -type f || true

      - name: Commit Update
        run: |
          git add .

          git commit -m "Clean old project and extract new ZIP" || echo "No changes"

          git pull origin main --rebase || true

          git push origin main --force
