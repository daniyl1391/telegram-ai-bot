name: Update Project From ZIP

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove old extracted files
        run: |
          rm -rf bot
          rm -rf extracted
          rm -f main.py
          rm -f Dockerfile
          rm -f requirements.txt
          rm -f railway.toml
          rm -f README.md
          rm -f tests.py

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract new ZIP
        run: |
          mkdir extracted
          unzip -o telegram_ai_bot_complete.zip -d extracted

      - name: Copy project files
        run: |
          cp -r extracted/*/* . || true
          cp -r extracted/*/.* . 2>/dev/null || true

      - name: Show result
        run: |
          echo "Updated structure:"
          ls -la
          find bot -maxdepth 3 -type f || true

      - name: Commit update
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add .

          git commit -m "Update project from new ZIP" || echo "No changes"

          git push
