name: Update Project From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Git Config
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

    - name: Clean Old Project
      run: |
        find . -mindepth 1 \
        ! -path "./.git" \
        ! -path "./.git/*" \
        ! -path "./.github" \
        ! -path "./.github/*" \
        ! -name "telegram_ai_bot_fixed (1).zip" \
        -exec rm -rf {} +

        echo "Old files deleted"

    - name: Wait
      run: |
        sleep 13

    - name: Extract ZIP
      run: |
        mkdir extracted

        unzip -o "telegram_ai_bot_fixed (1).zip" -d extracted

        echo "ZIP extracted"

        find extracted -maxdepth 3 -type f | head -100

    - name: Copy Project To Root
      run: |

        PROJECT=$(find extracted -name "main.py" | head -1 | xargs dirname)

        echo "Project found:"
        echo $PROJECT

        cp -r "$PROJECT"/* .
        cp -r "$PROJECT"/.[!.]* . 2>/dev/null || true


    - name: Remove Extract Folder
      run: |
        rm -rf extracted

    - name: Check Files
      run: |
        echo "Final structure:"
        ls -la
        echo "---"
        find . -maxdepth 2 -type f


    - name: Commit Update
      run: |
        git add -A

        git commit -m "Update project from telegram_ai_bot_fixed ZIP" || echo "No changes"

        git push origin main --force
