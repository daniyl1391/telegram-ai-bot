name: Update AI Bot From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Remove old project files
        run: |
          rm -rf bot
          rm -rf tests_stubs
          rm -f main.py
          rm -f Dockerfile
          rm -f railway.toml
          rm -f Procfile
          rm -f README.md
          rm -f requirements.txt
          rm -f .env.example
          rm -f .dockerignore
          rm -f tests.py

      - name: Install unzip
        run: |
          sudo apt update
          sudo apt install -y unzip

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o "telegram_ai_bot_fixed (1).zip" -d extracted

      - name: Copy project files
        run: |
          cp -r extracted/*/* . 2>/dev/null || true
          cp -r extracted/*/.* . 2>/dev/null || true

      - name: Check final structure
        run: |
          echo "FINAL PROJECT:"
          ls -la
          echo "BOT:"
          find bot -maxdepth 2 -type f

      - name: Commit changes
        run: |
          git add .

          git commit -m "Update Telegram AI Bot" || echo "No changes"

          git pull origin main --rebase || true

          git push origin main --force
