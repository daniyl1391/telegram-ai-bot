name: Safe Update From ZIP Keep Data

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  update:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0


    - name: Git Config
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"


    - name: Backup User Data
      run: |
        mkdir -p backup

        find . \
        \( \
        -name "*.db" \
        -o -name "*.sqlite" \
        -o -name "*.sqlite3" \
        -o -path "./data" \
        -o -path "./database" \
        -o -name ".env" \
        \) \
        -exec cp -r {} backup/ \; || true


        echo "Data backup completed"


    - name: Extract New ZIP
      run: |

        mkdir new_project

        unzip -o "telegram_ai_bot_upgraded.zip" -d new_project


        echo "Extracted:"
        find new_project -maxdepth 3 -type f | head -100



    - name: Replace Code Only
      run: |

        PROJECT=$(find new_project -name "main.py" | head -1 | xargs dirname)

        echo "New project:"
        echo $PROJECT


        rsync -av \
        --exclude "*.db" \
        --exclude "*.sqlite" \
        --exclude "*.sqlite3" \
        --exclude "data/" \
        --exclude "database/" \
        --exclude ".env" \
        "$PROJECT"/ ./


    - name: Restore Data
      run: |

        cp -rf backup/* . 2>/dev/null || true


        echo "Old user data restored"



    - name: Remove Temp
      run: |

        rm -rf new_project
        rm -rf backup


    - name: Check
      run: |

        echo "Final files:"
        ls -la


        echo "Database files:"
        find . \
        \( -name "*.db" -o -name "*.sqlite" \)



    - name: Commit Update
      run: |

        git add -A

        git commit -m "Safe update keep users data" || echo "No changes"

        git push origin main
