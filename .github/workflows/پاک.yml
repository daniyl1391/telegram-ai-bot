name: Clean Repository Keep ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git Config
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Delete Project Files
        run: |
          find . -mindepth 1 \
          ! -path "./.git" \
          ! -path "./.git/*" \
          ! -path "./.github" \
          ! -path "./.github/*" \
          ! -name "vip.zip" \
          -exec rm -rf {} +

          echo "Clean done"
          ls -la

      - name: Commit
        run: |
          git add -A
          git commit -m "Clean all files keep vip zip" || true
          git push origin main --force
