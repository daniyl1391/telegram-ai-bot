name: Clean Wait Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Git Config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"


      - name: Delete Everything Except ZIP
        run: |

          echo "Deleting project..."

          find . -mindepth 1 \
          ! -path "./.git*" \
          ! -name "telegram_ai_bot_fixed (1).zip" \
          -exec rm -rf {} +

          echo "Repository cleaned"

          ls -la


      - name: Wait 13 Seconds
        run: |
          echo "Waiting..."
          sleep 13
          echo "Continue"


      - name: Install unzip
        run: |
          sudo apt update
          sudo apt install unzip -y


      - name: Extract ZIP
        run: |

          echo "Extracting ZIP..."

          mkdir extracted

          unzip -o "telegram_ai_bot_fixed (1).zip" -d extracted

          echo "Extract completed"

          find extracted -maxdepth 3 -type f


      - name: Copy Project
        run: |

          echo "Copy files..."

          cp -r extracted/*/* . 2>/dev/null || true
          cp -r extracted/*/.* . 2>/dev/null || true


      - name: Check Result
        run: |

          echo "FINAL STRUCTURE"

          ls -la

          echo "---"

          find . -maxdepth 2 -type f


      - name: Commit And Push
        run: |

          git add .

          git commit -m "Clean repository and extract fresh ZIP" || echo "No changes"

          git push origin main --force
