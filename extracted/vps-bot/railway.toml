[build]
# Railway detects Dockerfile automatically
builder = "dockerfile"

[deploy]
# Start the bot with polling (most reliable on Railway)
startCommand = "python -m bot.main"

# Railway will auto-restart on crash
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# Don't require a health check for background workers
# If using webhook mode, healthcheck should target the webhook endpoint
# healthcheckPath = "/"

# Memory and CPU resources (optional, for larger deployments)
# resources:
#   cpu: 256m
#   memory: 512Mi
